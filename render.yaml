services:
  - type: web
    name: autohub-showroom
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: AUTOHUB_ENV
        value: production
      - key: AUTOHUB_SECRET_KEY
        generateValue: true
      - key: AUTOHUB_ADMIN_PASSWORD
        generateValue: true

